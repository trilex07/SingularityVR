; SingularityVR first-person texture override - research injector.
; Place next to dinput8.dll (the game's Binaries folder).
;
; enabled=1      master switch. 0 = DLL loads but does nothing.
; mode_apply=1   1 = substitute matching textures, 0 = LOG ONLY (no swap).
;                Start with 0 if unsure, check texture_override.log, then set 1.
; texturesdir    folder next to the DLL holding the replacement .dds files.
; capture=1       diagnostic: dump the mip0 the engine uploads for larger DXT
;                textures into capturesdir\ (used to recover textures UModel
;                cannot read offline, e.g. the first-person pistol). Set to 0
;                for normal play; it writes files on first use of each texture.
; capture_min    only capture textures at least this wide/tall (default 512).
[general]
bridge_owned=1
priority_material_mode=1
remaster_apply=1
effects_remaster=1
remasterdir=texture-override-remaster
enabled=1
mode_apply=1
texturesdir=texture-override
capture=0
capturesdir=capture
capture_min=512
; Per-group switches. 1 = load this category, 0 = skip it (original game
; textures stay). Missing keys default to ON. The hub panel writes these keys;
; a restart applies them. Groups: hands weapons enemies env glyphs fx.
[TextureGroups]
hands=1
weapons=1
enemies=1
env=1
glyphs=1
fx=1
; Quality tier: 2x (full set, in texturesdir) or 4K/8K proof sets (in
; texturesdir-4K / texturesdir-8K). Read once at startup; the hub writes this
; key and a restart applies it. A missing tier file keeps the original game
; texture for that target. Unknown values fall back to 2x. 16K is banned
; (D3D9 cap + 179 MB per texture + 32-bit address space).
[TextureQuality]
Quality=8K
; marker_hash   when set, capture stops being a dump-everything firehose: only
;                textures bound around this content hash are dumped. Used to
;                isolate the first-person pistol via its laser texture.
marker_hash=0
