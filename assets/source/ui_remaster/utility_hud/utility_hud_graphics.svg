<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Ammo Plate -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="260" height="100" rx="4" fill="#0E1219" fill-opacity="0.9" stroke="#415566" stroke-width="2"/>
    <rect x="8" y="8" width="244" height="84" rx="2" fill="#080C10" stroke="#1E2A36" stroke-width="1"/>
    <text x="16" y="24" font-family="Bahnschrift, Arial" font-size="10" fill="#82A0B4">КАЛИБР: 7.62x39mm // ВОЛК S-4</text>
    <text x="16" y="65" font-family="Bahnschrift, Arial" font-size="34" font-weight="bold" fill="#2CE8E4" filter="url(#cyanGlow)">30</text>
    <text x="80" y="65" font-family="Bahnschrift, Arial" font-size="18" fill="#4B5F73">/</text>
    <text x="95" y="65" font-family="Bahnschrift, Arial" font-size="18" font-weight="bold" fill="#EBF4FA">180</text>
  </g>

  <!-- 2. Objective Marker -->
  <g transform="translate(420, 70)" stroke="#FFA927" stroke-width="2" fill="none">
    <polygon points="0,-36 36,0 0,36 -36,0" fill="#18202A" fill-opacity="0.9"/>
    <polygon points="0,-28 28,0 0,28 -28,0" stroke="#FFD26E" fill="#24303C"/>
    <circle cx="0" cy="0" r="8" fill="#2CE8E4" stroke="none" filter="url(#cyanGlow)"/>
    <polygon points="0,48 -8,38 8,38" fill="#FFA927" stroke="none"/>
  </g>
</svg>
