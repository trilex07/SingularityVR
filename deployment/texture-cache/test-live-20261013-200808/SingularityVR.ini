; SingularityVR.ini - the shipped configuration.
;
; This file is PARTIAL on purpose. The mod reads about 111 settings; the ones here
; are the deliberate choices and the ones worth tuning. Anything absent takes the
; code's own default, which is the value every tested run used.
;
; Delete a line and you get the code default back. Delete the file and the mod
; still runs - you lose the per-weapon gun alignment below, which is the only
; thing here you cannot easily re-derive.
;
; AutoResX/AutoResY are the mod's cache of the headset's size. It writes them
; itself on first launch and injects them from the second onward, because the DLL
; loads before the game reads its command line and asking the headset that early
; would put XR startup in the process-launch path. The values shipped here are a
; sensible VR-shaped starting point; yours will replace them after one run.
;
; AutoResX/AutoResY are the mod's cache of the headset's size. It writes them
; itself on first launch and injects them from the second onward, because the DLL
; loads before the game reads its command line and asking the headset that early
; would put XR startup in the process-launch path. The values shipped here are a
; sensible VR-shaped starting point; yours will replace them after one run.

[Render]
ShowControllerArms=1
; Keep the two weighted hand regions on their own tracked controller poses.
; This is the stable glove-only path; ArmIK remains off until the headset pass.
IndependentHandsPrototype=1
ArmIKMode=0
; 1 = census-only; 2 = tracked gloves+wrist only (forearm mesh hidden, no arm collapse).
; The verified SP section maps and static census are complete; use the live wrist path.
; Was 0 = OFF, which contradicted the line above and made the gloves-only model never
; appear (ApplyGloveIsolation returns at "if (mode <= 0)", so GloveCensus never logged
; either). The glove integration doc records the installed INI as GloveIsolate=2; this
; line was simply never updated, so every deployment re-armed 0. Set to 2 to match the
; comment, the doc, and docs\HANDOFF_GLOVEISOLATE_20261009.md. 0 reverts.
GloveIsolate=2
; 0 = full glove section; forearm cut is GloveStumpScale behind the wrist. 1 = face clip flush at the wrist.
GloveFaceFilter=0
VfxSmoke=0
VfxScreenFlash=1
; 0 = asset socket table; positive value is a manual global override.
; 150mm = safe pistol default (typical barrel 100-170mm). Rifles need 300-500mm — adjust in VR panel.
VfxMuzzleOffsetMm=150
Debug=0
AutoResX=5264
AutoResY=2684
StartInVr=1
; Keep UE3 cinematic geometry in the OpenXR stereo path. Bink/video
; presentation remains handled by VideoStereo.
; 1 = one coherent image in both eyes for intro/cinematics (avoids doubled Bink/UI).
CutsceneFlatMode=1
; 0 = copy Bink into each eye via MonoPair (intro/menu). 1 = per-eye video rewrite (can double).
VideoStereo=0
; GFx menu scale. 100 = native layout. Intro/menu zoom-out is the full-frame fit into each eye.
MenuInsetPct=100
; Forearm keep (20 = 0.20 stump behind the wrist; 12 = tighter; 100 = no cut).
GloveStumpScale=20
; Mesh +X nudge on the left arm (bind left). 0 = wrist stays on the controller only.
GloveLeftShift=12
HideCrosshair=1
; 0 = native particle systems active (LocalToWorld updates for exact muzzle position)
;    Template=nullptr suppression keeps them from rendering on the SBS seam
; 1 = suppress at component-pointer level (breaks LocalToWorld, fallback to offset table)
HideMuzzleFx=0
; Comfortable defaults for the native VR scale. 100 is the original flat-game size.
WorldScalePct=80
VrShadows=1
; 3 = protect light-space (stereo shadows). 1 = mono fallback only — breaks VR shadow fix.
ShadowMode=3
; ExtraCamReg=13 was tested in run 43: geometry stretched to the screen edge,
; shadows unchanged. Keep disabled; investigate the receiver artifact elsewhere.
ExtraCamReg=-1
WeaponFxRideGun=1
OcclusionQueryMode=2

; How big an open NOTE is, as a percent of the game's own layout, scaled about the
; centre of the eye. The game draws a note across the entire screen, which reads
; fine on a monitor and badly in a headset - at full size its edges sit out in the
; periphery and you end up moving your head along each line to read it. 100 turns
; this off and gives you the original layout. Also on the panel: DISPLAY page,
; NOTE SIZE. 40 is the value that read comfortably in a headset when this was
; tuned; adjust it there with a note open rather than guessing here.
NoteInsetPct=40

; The single captured GFx menu is head-relative. 950 mm keeps the complete panel readable
; without placing it across the room; the pointer and native viewport use the same plane.
VrMenuDistanceMm=950

; Keeps the UI transform armed for the whole frame instead of just the first draw, so long
; popup/note text that spans multiple draws does not go unremapped across the stereo seam
; (run 253). v0.1.0-alpha shipped without this line - it is now also the code default, kept
; explicit here for the same reason GunAnchorFwd is below.
HudArmSticky=0

; The laser sight. A line along the bullet's real path, from the gun's rotation
; point. Toggle it in game by holding A for a second, or from the panel's DISPLAY
; page - either route writes the value back here. It switches itself off while the
; sniper scope is up, which has its own reticle.
LaserSight=1

; Aiming. The game's own aim animation slides the weapon toward the centre of the
; screen, which is right in head mode and meaningless on a hand-held gun.
; AdsMaskAnim holds that animation still; AdsPullbackUU (under [Input]) replaces
; it with a pull back along the line the gun is already pointing.
;
; The mask suppresses recoil and reload motion WHILE AIMING. That is the trade,
; not a bug - set AdsMaskAnim=0 for the game's own behaviour.
; AdsMaskLo/Hi is the bone range that carries the weapon, measured on the assault
; rifle. If another weapon looks wrong while aiming, that range is the first
; suspect.
AdsMaskAnim=1
AdsMaskLo=5
AdsMaskHi=22
AdsMaskTailMs=400

; Diagnostics. Investigation tools, shipped off. Each one costs work while it is
; armed, so leave them alone unless you are chasing something.
DropPrimCount=0
ScopeQuadDump=0
ScopeDrawCensus=0
; Temporary bounded gameplay HUD census; remove after native prompt geometry is confirmed.
UiElementDump=8
AdsConstDump=0
AdsFreezeLo=-1
AdsFreezeHi=-1
PauseMenuDiag=1
CutsceneCinemaMask=1
MenuOverlay=1
VfxLook=0
ShadowTest=0
DropExtraTarget=0
VfxMuzzleOrigin=1

[Input]
AimMethod=1
TurnMode=2
TurnSpeed=120
TurnAngle=30
TurnSign=1
WalkDirection=0
