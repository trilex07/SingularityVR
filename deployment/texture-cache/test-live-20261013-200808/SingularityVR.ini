; L3+R3 captures a diagnostic frame; recenter is opt-in from VR Settings > Controller.
RecenterChord=1
GunScalePct=75
; PSVR2/SteamVR Sense may expose trigger/value without trigger/touch.
; Keep anti-phantom startup protection short so real R2 fire is not blocked for tens of seconds.
TriggerTouchGateGraceFrames=120
HolsterFwd=8
HolsterRight=12
HolsterUp=-30
CutsceneStickTurn=2
CutsceneLockCamera=0
AimModeParts=3
GunAlign0Verts=11387
GunAlign0Fwd=26
GunAlign0Right=8
GunAlign0Up=-13
GunAlign0YawTenths=30
GunAlign0PitchTenths=-28
GunAlign1Verts=8297
GunAlign1Fwd=30
GunAlign1Right=10
GunAlign1Up=-13
GunAlign1YawTenths=30
GunAlign1PitchTenths=0
GunAlign2Verts=5799
GunAlign2Fwd=30
GunAlign2Right=9
GunAlign2Up=-13
GunAlign2YawTenths=10
GunAlign2PitchTenths=0
GunAlign3Verts=11389
GunAlign3Fwd=30
GunAlign3Right=13
GunAlign3Up=-13
GunAlign3YawTenths=43
GunAlign3PitchTenths=0
GunAlign4Verts=0
GunAlign5Verts=0
GunAlign6Verts=0
GunAlign7Verts=0
TmdOnOffHand=1
TmdFwd=30
TmdRight=-9
TmdUp=-13
TmdYawTenths=0
TmdPitchTenths=0
TmdRollTenths=0
TmdArmStep=50
TmdHideVerts=0
TmdBoneMode=0
TmdBoneMesh0=0
TmdBoneLo0=-1
TmdBoneHi0=-1
TmdBoneMesh1=0
TmdBoneLo1=-1
TmdBoneHi1=-1
TmdBoneMesh2=0
TmdBoneLo2=-1
TmdBoneHi2=-1
TmdBoneMesh3=0
TmdBoneLo3=-1
TmdBoneHi3=-1
TmdArmMesh0=0
TmdArmMode0=0
TmdArmFrom0=0
TmdArmTo0=1000
TmdArmMesh1=0
TmdArmMode1=0
TmdArmFrom1=0
TmdArmTo1=1000
TmdArmMesh2=0
TmdArmMode2=0
TmdArmFrom2=0
TmdArmTo2=1000
