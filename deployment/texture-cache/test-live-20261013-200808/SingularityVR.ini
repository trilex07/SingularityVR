[Diagnostic]
; Keep desktop-HMD automation off for normal Steam/PSVR2 sessions.
ForceDesktopVr=0
DesktopCapture=0
DesktopAutomation=0
; L3 glove proof only: bounded per-second gate counters, no render behavior change.
IndependentHandsAudit=1

; ---- where the gun sits, and what it turns about ----
;
; The anchor is the point the gun hangs from AND the point it rotates about, in
; engine units from your eye: forward, right, up. It is also where the laser
; starts. This is the GLOBAL anchor - the per-weapon block below overrides it for
; any weapon listed there.
GunAnchorFwd=30
GunAnchorRight=9
GunAnchorUp=-13

; The gun follows your hand's position as well as its rotation.
GunFollowPosition=1
; ...and is anchored to YOUR head rather than the engine's eye, so leaning and
; recentring do not slide it against the view.
GunFollowsHeadOffset=1

; Rotation signs. These were found empirically and every working run has used
; these values - see the note in STATUS about not "reasoning" them to a different
; combination. Change them only if the gun turns the wrong way about an axis.
GunSignYaw=1
GunSignPitch=1
GunSignRoll=1
GunSignCombo=2
GunSignPosZ=-1

; How far aiming pulls the weapon back along the line it is pointing. The sight
; picture does not move - the line is unchanged, the gun is just nearer. Only
; meaningful with AdsMaskAnim=1; without it you get this AND the game's animation.
AdsPullbackUU=10

; ---- per-weapon alignment ----
;
; Measured in the headset against the laser sight. A weapon is identified by its
; first-person vertex count, which is the same number on every copy of the game,
; so these transfer. A slot here overrides the built-in value for that weapon.
;
; Tune from the panel: hold Y, WEAPON ALIGN, adjust with the stick, close it.
; Fwd/Right/Up are the anchor for that weapon; YawTenths/PitchTenths trim the
; barrel in TENTHS of a degree (30 = +3.0 deg) so the barrel lines up with the
; laser. The trim moves the MESH only and can never change where a shot goes.
;
; The sniper is aligned against its own SCOPE RETICLE rather than the laser - the
; laser switches itself off behind the scope, but the reticle is just as good a
; reference and scoped aim already tracks it.
;
;   11387  assault rifle
GunAlign0Verts=11387
GunAlign0Fwd=26
GunAlign0Right=8
GunAlign0Up=-13
GunAlign0YawTenths=30
GunAlign0PitchTenths=-28
;   8297   shotgun
GunAlign1Verts=8297
GunAlign1Fwd=30
GunAlign1Right=10
GunAlign1Up=-13
GunAlign1YawTenths=30
GunAlign1PitchTenths=0
;   5799   pistol
GunAlign2Verts=5799
GunAlign2Fwd=30
GunAlign2Right=9
GunAlign2Up=-13
GunAlign2YawTenths=10
GunAlign2PitchTenths=0
;   11389  sniper
GunAlign3Verts=11389
GunAlign3Fwd=30
GunAlign3Right=13
GunAlign3Up=-13
GunAlign3YawTenths=43
GunAlign3PitchTenths=0
; Free slots. Set Verts to a weapon's vertex count to tune it, or use the panel.
GunAlign4Verts=0
GunAlign5Verts=0
GunAlign6Verts=0
GunAlign7Verts=0

; ---- TMD (Time Manipulation Device) - hand anchor and left-arm mesh trimming ----
;
; Anchor, in engine units from your eye: forward, right, up. Tune from the panel:
; hold Y, TMD ALIGN.
TmdFwd=40
TmdRight=-9
TmdUp=-14

; Without these, the TMD gauntlet mesh (4818) and the arms mesh draw in full while the
; TMD is raised, instead of trimmed to the left arm. v0.1.0-alpha shipped with none of
; this - now also the code default, kept explicit here for the same reason as above.
; Tune from the panel: TMD ALIGN -> BONE RANGES / TRIANGLE WINDOW.
TmdBoneMesh0=0
TmdBoneLo0=13
TmdBoneHi0=29
TmdBoneMesh1=4818
TmdBoneLo1=7
TmdBoneHi1=8
TmdArmMesh0=4818
TmdArmMode0=1
TmdArmFrom0=36
TmdArmTo0=90

[Upscaling]
; NVIDIA Image Scaling. Off is the safe native-copy baseline.
; NIS lowers the UE3 render size and reconstructs each eye to the headset size.
Mode=Off
RenderScale=1.00
OutputScale=1.00
Sharpness=0.20

[Localization]
; Polish language support
; 0 = Disabled (default English), 1 = Enabled (Polish text + Polish dubbing)
PolishLanguage=1

; Fallback behavior when Polish assets are missing
; 0 = Show missing key, 1 = Fallback to English
PolishFallbackToEnglish=1

; UI text resources
; Paths relative to Binaries/vr-assets/localization/pl/
PolishTextManifest=localization/pl/polish_text.jsonl
PolishVoiceManifest=localization/pl/polish_voice.jsonl
PolishStoryManifest=localization/pl/polish_story_voice.jsonl

; Audio assets
; Paths relative to Binaries/vr-assets/audio/polish/
PolishUiAudioPath=audio/polish/ui
PolishStoryAudioPath=audio/polish/story

; UI language display
; 0 = English labels, 1 = Polish labels in VR settings
ShowPolishLabels=1

; Audio fallback
; 0 = Silent if Polish audio missing, 1 = Fallback to English audio
PolishAudioFallback=1

; Debug
; 0 = Normal, 1 = Log missing keys/audio, 2 = Verbose
LocalizationDebug=0
