; SingularityVR.ini - the shipped configuration.
;
; This file is PARTIAL on purpose. The mod reads about 111 settings; the ones here
; are the deliberate choices and the ones worth tuning. Anything absent takes the
; code's own default, which is the value every tested run used.
;
; Delete a line and you get the code default back. Delete the file and the mod
; still runs - you lose the per-weapon gun alignment below, which is the only
; thing here you cannot easily re-derive.
;
; AutoResX/AutoResY are the mod's cache of the headset's size. It writes them
; itself on first launch and injects them from the second onward, because the DLL
; loads before the game reads its command line and asking the headset that early
; would put XR startup in the process-launch path. The values shipped here are a
; sensible VR-shaped starting point; yours will replace them after one run.

[Render]
AmmoPlateEnabled=1
PropDumpPawn=0
CineMenuLoadClear=1
HealthPlateEnabled=1
KatorgaHudEnabled=1
TextureBridgeOwned=1
CutsceneScreenDistanceMm=2000
CutsceneWorldScreen=1
CutsceneMenuPairFix=0
CutsceneMenuHandoffFix=1
NoTmdWristAnchorFix=1
NoTmdPaletteFix=1
ShowControllerArms=0
; Keep the two weighted hand regions on their own tracked controller poses.
; This is the stable glove-only path; ArmIK remains off until the headset pass.
IndependentHandsPrototype=1
ArmIKMode=0
; 1 = census-only; 2 = tracked gloves+wrist only (forearm mesh hidden, no arm collapse).
GloveIsolate=2
GloveRendererEnabled=1
GloveNativeEnabled=1
NativeGloveCuffClosure=1
KnifeHandGripEnabled=1
KnifeTrackedMelee=1
; Anchored virtual cinema screen for main menu (avoids 3D background glitching, 0 = rollback to standard HUD)
MenuWorldScreen=0
; Suppress flat-game screen shake, camera pitch/yaw shake and roll oscillation in VR
VrCameraShakeSuppression=1
VrTranslationStabilization=0
HandThumbPoseFix=1
KnifeSceneLighting=1
; 0 = full glove section; forearm cut is GloveStumpScale behind the wrist. 1 = face clip flush at the wrist.
GloveFaceFilter=0
VfxHost=0
VfxSmoke=0
VfxScreenFlash=0
; 0 = asset socket table; positive value is a manual global override.
VfxMuzzleOffsetMm=150
Debug=0
AutoResX=5544
AutoResY=2828
StartInVr=1
; Keep UE3 cinematic geometry in the OpenXR stereo path. Bink/video
; presentation remains handled by VideoStereo.
; 1 = one coherent image in both eyes for intro/cinematics (avoids doubled Bink/UI).
CutsceneFlatMode=1
; 0 = copy Bink into each eye via MonoPair (intro/menu). 1 = per-eye video rewrite (can double).
VideoStereo=0
; GFx menu scale. 100 = native layout. Intro/menu zoom-out is the full-frame fit into each eye.
MenuInsetPct=100
; Forearm keep (20 = 0.20 stump behind the wrist; 12 = tighter; 100 = no cut).
GloveStumpScale=20
; Mesh +X nudge on the left arm (bind left). 0 = wrist stays on the controller only.
GloveLeftShift=12
HideCrosshair=1
; 0 = native particle systems active (LocalToWorld updates for exact muzzle position)
HideMuzzleFx=0
; Comfortable defaults for the native VR scale. 100 is the original flat-game size.
WorldScalePct=80
VrShadows=1
; 3 = protect light-space (stereo shadows). 1 = mono fallback only - breaks VR shadow fix.
ShadowMode=3
; PSVR2-verified stereo shadow reconstruction and native pass classification.
ShadowWorldReceiverFix=1
ShadowForegroundClearFix=1
ShadowFirstPersonReceiverFix=1
ExtraCamReg=-1
WeaponFxRideGun=1
OcclusionQueryMode=2

; How big an open NOTE is, as a percent of the game's own layout, scaled about the
; centre of the eye.
NoteInsetPct=40

; The single captured GFx menu is head-relative. 950 mm keeps the complete panel readable.
VrMenuDistanceMm=950
FrontMenuCleanBackdrop=1
FrontMenuScalePct=80
FrontMenuDistanceMm=1800
HolsterMarkerStyle=1

HudArmSticky=0

; The laser sight.
LaserSight=1

