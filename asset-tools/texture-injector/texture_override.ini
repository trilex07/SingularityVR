; SingularityVR first-person texture override - research injector.
; Place next to dinput8.dll (the game's Binaries folder).
;
; enabled=1      master switch. 0 = DLL loads but does nothing.
; mode_apply=1   1 = substitute matching textures, 0 = LOG ONLY (no swap).
;                Start with 0 if unsure, check texture_override.log, then set 1.
; texturesdir    folder next to the DLL holding the replacement .dds files.
; capture=1       diagnostic: dump the mip0 the engine uploads for larger DXT
;                textures into capturesdir\ (used to recover textures UModel
;                cannot read offline, e.g. the first-person pistol). Set to 0
;                for normal play; it writes files on first use of each texture.
; capture_min    only capture textures at least this wide/tall (default 512).
[general]
enabled=1
mode_apply=1
texturesdir=texture-override
capture=0
capturesdir=capture
capture_min=512
